name: "✨ 功能建议"
description: "为鲸鱼娘（dsh-whale-musume）提一个新功能、新互动或改进想法"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提之前先看一眼

        - **使用问题 / 安装配置 / 想晒图分享**：请走
          [Discussions](https://github.com/Sutera-Diffusus/dsh-whale-musume/discussions)，
          那里更适合问答和闲聊，Issue 区留给可跟踪的具体事项。
        - **先搜一遍已有 Issue 与已合并的 PR**：<https://github.com/Sutera-Diffusus/dsh-whale-musume/issues?q=is%3Aissue>
          想法可能已经实现，或者已经被讨论过为什么不合适。
        - **鲸鱼娘的设计底线**（和它们冲突的设想请说明怎么绕开）：
          纯前端注入、只操作自己的节点、不改动 DSH 业务 DOM；**无遥测、无外部请求**；
          天气为选填（Open-Meteo）；余额功能默认关闭，且只访问本机 `127.0.0.1:3020`。
        - 涉及新立绘、新素材的建议，请说明素材来源与授权（仓库只收可再分发的素材）。

  - type: textarea
    id: scenario
    attributes:
      label: 想解决什么场景
      description: "别急着写方案，先说说你在什么场景下觉得缺了点什么——越具体越好。"
      placeholder: |
        例如：我经常挂着 DSH 跑长任务，回来时想一眼看出「刚才这段时间跑了多久、报了几次错」，
        现在只有状态和台词，看不出这段时间的概况。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: "你希望她怎么做？交互、出现时机、默认开关状态、大概长什么样，都可以写。"
      placeholder: "例如：鼠标悬停时弹一个小小的「本次会话概况」卡片，显示累计工作时长与失败次数，默认关闭。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: "你考虑过的其他做法，或者「其实不做也行」的理由。没有就写「暂无」。"
      placeholder: "例如：也可以只在右键菜单里加一项，不做常驻入口。"
    validations:
      required: false

  - type: dropdown
    id: pr_willingness
    attributes:
      label: 是否愿意提 PR
      description: "这只影响我们怎么推进：愿意自己动手的话，可以直接在下面写你打算从哪个文件下手。"
      options:
        - "愿意，我可以自己提 PR"
        - "愿意，但需要一些指引（比如从哪个文件下手）"
        - "暂时没时间，只是提个想法"
        - "还没想好"
    validations:
      required: true
